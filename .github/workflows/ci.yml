name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Runs this repository's own action on the example, which leaves out the cache on purpose.
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - id: check
        uses: ./
        with:
          design: examples/shop/design.json
          infra: examples/shop/docker-compose.yml
      - name: The example's drift was found
        shell: bash
        env:
          DRIFTED: ${{ steps.check.outputs.drifted }}
        run: test "$DRIFTED" = true
