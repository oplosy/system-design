name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Keep the traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Runs this repository's own action on the example, which leaves out the cache on purpose.
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - id: check
        uses: ./
        with:
          design: examples/shop/design.json
          infra: examples/shop/docker-compose.yml
          share: true
      - name: The example's drift was found
        shell: bash
        env:
          DRIFTED: ${{ steps.check.outputs.drifted }}
        run: test "$DRIFTED" = true && test -s "$RUNNER_TEMP/system-design-review.html"
