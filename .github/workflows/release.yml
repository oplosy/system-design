name: Release

# Push a tag like v1.2.0 (matching package.json) to publish it to npm and move the action's major tag (v1) to it,
# so users of oplosy/system-design@v1 get the release without anyone force-pushing tags by hand.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::Add an npm automation token as the NPM_TOKEN secret, then re-run this job to publish."
            exit 0
          fi
          npm publish --provenance --access public
      - name: Move the major tag to this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
