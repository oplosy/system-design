version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Later versions draw the PNG/SVG export wrong; React Flow's own export example pins this version for the same reason.
      - dependency-name: html-to-image
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
